[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-video-consistency"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<6", "Pillow>=10", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6", "h5py>=3.8"]

[tool.setuptools.packages.find]
include = ["src*", "pipelines*"]
