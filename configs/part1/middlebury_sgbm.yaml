# Part 1A：四组经典双目、全有效GT评价与固定开发集选参。
protocol_status: middlebury_course_v1
dataset:
  name: Middlebury Stereo v3
  root: data/middlebury/MiddEval3/trainingQ
  resolution: quarter
  expected_scenes: 15
  calibration_file: calib.txt
  ground_truth_disparity: disp0GT.pfm
  non_occlusion_mask: mask0nocc.png
split:
  development_scenes:
  - Adirondack
  - Jadeplant
  - Motorcycle
  - Pipes
  - PlaytableP
  evaluation_scenes:
  - ArtL
  - MotorcycleE
  - Piano
  - PianoL
  - Playroom
  - Playtable
  - Recycle
  - Shelves
  - Teddy
  - Vintage
  rule: Tune BM and SGBM only on the five declared development scenes; report all
    scenes and the held-out macro separately.
geometry:
  formula: z_m = focal_length_px * baseline_mm / (disparity_px + doffs_px) / 1000
  calibration_baseline_unit: millimeter
  output_depth_unit: meter
  opencv_disparity_scale: 16.0
  invalid_depth_representation: nan_with_boolean_mask
evaluation:
  mask_name: finite_positive_gt
  primary_metrics:
  - disparity_mae_px
  - valid_prediction_fraction
  auxiliary_metrics: [bad1, bad2, bad4, depth_abs_rel, depth_rmse_m]
  bad_pixel_rule: absolute_error_strictly_greater_than_threshold; invalid_counts_as_bad; full_gt_denominator
  invalid_prediction_rule: exclude_from_mae_keep_in_fraction_denominator; zero_valid_mae_is_null
  depth_bin_edges_m:
  - 0.0
  - 2.0
  - 4.0
  - inf
  aggregation: per_scene_macro_mean
  disparity_threshold_unit: quarter_resolution_pixel
experiments:
  bm_fixed:
    algorithm: bm
    parameter_source: fixed_empirical
    parameters:
      min_disparity: 0
      block_size: 15
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      pre_filter_cap: 31
      texture_threshold: 10
      disp12_max_diff: 1
      lr_threshold_px: 1.0
  bm_tuned:
    algorithm: bm
    parameter_source: bound_development_selection
    parameters: null
  sgbm_fixed:
    algorithm: sgbm
    parameter_source: fixed_empirical
    parameters:
      min_disparity: 0
      block_size: 5
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      pre_filter_cap: 63
      disp12_max_diff: 1
      mode: sgbm_3way
      lr_threshold_px: 1.0
  sgbm_tuned:
    algorithm: sgbm
    parameter_source: bound_development_selection
    parameters: null
tuning:
  objective: minimum_mae_with_fixed_fraction_floor
  tie_breakers:
  - higher_valid_prediction_fraction
  - lexicographic_candidate_parameters
  lr_threshold_px: 1.0
  rationale: 开发集有效预测比例不得低于同方法fixed基线；可行候选中取最小MAE；LR=1 px不参与搜索。
  bm:
    search:
      block_size:
      - 5
      - 9
      - 15
      - 21
      uniqueness_ratio:
      - 0
      - 5
      - 10
      - 15
      speckle_window_size:
      - 0
      - 50
      - 100
      texture_threshold:
      - 0
      - 10
      - 20
    fixed:
      min_disparity: 0
      speckle_range: 2
      pre_filter_cap: 31
      disp12_max_diff: 1
  sgbm:
    search:
      block_size:
      - 3
      - 5
      - 7
      uniqueness_ratio:
      - 0
      - 5
      - 10
      - 15
      speckle_window_size:
      - 0
      - 50
      - 100
    fixed:
      min_disparity: 0
      speckle_range: 2
      pre_filter_cap: 63
      disp12_max_diff: 1
      mode: sgbm_3way
sensitivity:
  disparity_errors_px:
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  depth_bin_width_m: 0.25
  theoretical_scope: shared_camera_geometry
  empirical_scope: compare_all_four_experiments
visualization:
  failure_zoom:
    scene: Jadeplant
    experiment: sgbm_tuned
    crop_xyxy:
    - 150
    - 10
    - 570
    - 350
outputs:
  root: outputs/part1/middlebury
  tuning_run: tuning
  evaluation_run: evaluation
  save_npz: true
  save_visualizations: true
