protocol_status: native_depth_error_analysis_v1
random_seed: 42
dataset:
  name: NYU Depth V2 labeled
  labeled_mat: data/nyuv2/nyu_depth_v2_labeled.mat
  labeled_mat_sha256: 2d724b0c0ab358aa1ce5df855e5bd14a2279ab7202efe22f32a30d612dcb86aa
  split_file: data/nyuv2/splits.mat
  split_file_sha256: 6e081404491a8bfba2f066beaa9713ef6046f9007aa5f799f2a350506a580cee
  split_variable: testNdxs
  expected_test_images: 654
baseline_outputs:
  depth_pro: outputs/part2/depth_pro_nyuv2/frozen_v1
  unidepth_v2: outputs/part2/unidepth_v2_nyuv2/frozen_v1
evaluation:
  crop:
    convention: Python half-open [top:bottom, left:right]
    top: 45
    bottom: 471
    left: 41
    right: 601
  valid_depth_m:
    minimum: 0.001
    maximum: 10.0
    bounds: exclusive
  clip_prediction_to_valid_range: true
  aggregation: per_image_macro_mean
  test_time_alignment: none
boundary_analysis:
  primary_metric: depth_pro_official_SI_boundary_F1
  supplemental_metric: tolerance_aware_depth_edge_precision_recall_f1
  edge_log_threshold: 0.04879016416943205
  edge_ratio_threshold: 1.05
  tolerance_pixels:
  - 1
  - 2
  - 3
  dilation_neighborhood: square_chebyshev
  edge_error_band_pixels: 3
  qualitative_selection:
    depth_pro_advantage: 7
    unidepth_v2_advantage: 7
    both_low_si_f1: 6
  role: supplemental_boundary_diagnosis
absolute_scale_analysis:
  per_image_scale_statistic: median_prediction_over_ground_truth
  within_scale_ratio:
  - 0.9
  - 1.1
  depth_bins_m:
  - - 0.001
    - 1.0
  - - 1.0
    - 2.0
  - - 2.0
    - 4.0
  - - 4.0
    - 6.0
  - - 6.0
    - 10.0
  oracle_alignment:
    enabled_for_diagnosis_only: true
    method: divide_each_prediction_by_its_per_image_median_prediction_over_gt
    forbidden_as_primary_result: true
statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_unit: image
  seed: 42
outputs:
  root: outputs/part2/key_analysis
