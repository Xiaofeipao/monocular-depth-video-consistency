protocol_status: frozen_v1
random_seed: 42
dataset:
  name: NYU Depth V2 labeled
  labeled_mat: data/nyuv2/nyu_depth_v2_labeled.mat
  labeled_mat_sha256: 2d724b0c0ab358aa1ce5df855e5bd14a2279ab7202efe22f32a30d612dcb86aa
  split_file: data/nyuv2/splits.mat
  split_file_sha256: 6e081404491a8bfba2f066beaa9713ef6046f9007aa5f799f2a350506a580cee
  split_variable: testNdxs
  matlab_indices_are_one_based: true
  expected_test_images: 654
model:
  name: Depth Pro
  repository: ml-depth-pro
  checkpoint: checkpoints/depth_pro/depth_pro.pt
  checkpoint_sha256: 3eb35ca68168ad3d14cb150f8947a4edf85589941661fdb2686259c80685c0ce
  precision: float16
  input_rgb: full_uncropped_image
  focal_length_source: model_prediction
  provide_external_focal_length: false
  depth_type: metric
  unit: meter
  alignment: none
evaluation:
  test_time_alignment: none
  native_scale: metric
  unit: meter
  crop:
    convention: "Python half-open [top:bottom, left:right]"
    top: 45
    bottom: 471
    left: 41
    right: 601
  valid_depth_m:
    minimum: 0.001
    maximum: 10.0
    bounds: exclusive
  clip_prediction_to_valid_range: true
  aggregation: per_image_macro_mean
  resize_prediction_to_ground_truth: bilinear_align_corners_false
metrics:
  depth: [abs_rel, sq_rel, rmse, rmse_log, delta1, delta2, delta3]
  boundary:
    name: depth_pro_official_SI_boundary_F1
    implementation: ml-depth-pro/src/depth_pro/eval/boundary_metrics.py
    threshold_min: 1.05
    threshold_max: 1.25
    threshold_count: 10
statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_unit: image
  seed: 42
efficiency:
  warmup_iterations: 1
  synchronize_cuda_for_timing: true
  report: [mean_seconds, median_seconds, p95_seconds, fps, peak_gpu_memory_bytes]
visualization:
  audit_test_positions: [0, 326, 653]
  failure_thresholds:
    abs_rel:
      operator: greater_than
      value: 0.25
    delta1:
      operator: less_than
      value: 0.60
    si_boundary_f1:
      operator: less_than
      value: 0.01
  metric_depth_range_m: [0.5, 10.0]
  absolute_error_max_m: 2.0
outputs:
  root: outputs/part2/depth_pro_nyuv2
  smoke_run: smoke_v1
  evaluation_run: frozen_v1
notes:
  - Feed the original full RGB to Depth Pro and apply the crop only during evaluation.
  - Do not pass NYUv2 focal length or use any GT scale/shift alignment.
  - Save raw native-metric float32 depth before clipping; clipping is evaluation-only.
  - Evaluate valid GT at 0.001--10 m and clip predictions to [0.001, 10] m.
  - The standard cropped 654-image GT is dense and has minimum positive depth 0.71330047 m, which permits the official SI_boundary_F1 implementation without filling invalid holes.
